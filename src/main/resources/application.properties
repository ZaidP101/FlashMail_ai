spring.application.name=AI-Email-Assistant

# Hugging Face API
hf.api.url = https://router.huggingface.co/v1
hf.model = Qwen/Qwen3-0.6B:featherless-ai
hf.api.token = ${HF_TOKEN}

# Supabase PostgreSQL Database
spring.datasource.url=jdbc:postgresql://db.qlimwizrubfwtmwsovie.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Supabase Auth REST API
supabase.url=https://db.qlimwizrubfwtmwsovie.supabase.co
supabase.anon.key=${SUPABASE_ANON_KEY}
supabase.service.key=${SUPABASE_SERVICE_KEY}