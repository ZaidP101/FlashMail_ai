<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashMail.ai Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.25rem; font-size: 0.875rem; color: #94a3b8; }
    input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 0.875rem;
      box-sizing: border-box;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: #fff;
      font-size: 0.875rem;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    #status { margin-top: 1rem; font-size: 0.875rem; }
  </style>
</head>
<body>
  <h1>FlashMail.ai Options</h1>
  <label for="apiUrl">API URL</label>
  <input type="url" id="apiUrl" placeholder="http://localhost:8080" />
  <label for="authToken">Auth Token (optional)</label>
  <input type="password" id="authToken" placeholder="Supabase access token" />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
